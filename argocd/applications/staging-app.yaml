# argocd/applications/staging-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-staging
  namespace: argocd
  labels:
    environment: staging
    app: gitops-demo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: staging-deploys
    notifications.argoproj.io/subscribe.on-sync-failed.slack:    staging-alerts
    notifications.argoproj.io/subscribe.on-health-degraded.slack: staging-alerts
spec:
  project: gitops-demo

  source:
    repoURL: https://github.com/sumanth-koppula/gitops-pipeline.git
    targetRevision: main             # Track the main branch
    path: k8s/overlays/staging

  destination:
    server: https://35.254.123.31
    namespace: gitops-staging

  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true         # Use SSA for better conflict handling in staging
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/currentReplicas

  revisionHistoryLimit: 10
