# k8s/overlays/staging/deployment-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
spec:
  replicas: 2                        # 2 replicas — mirrors prod topology
  template:
    spec:
      containers:
        - name: gitops-demo
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: NODE_ENV
              value: staging
            - name: LOG_LEVEL
              value: info
