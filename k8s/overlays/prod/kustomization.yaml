# k8s/overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-prod


images:
- name: gitops-demo
  newName: gcr.io/p3-cicd-pipeline/gitops-demo
  newTag: staging-7be0c72-10

patches:
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: gitops-demo
- path: configmap-patch.yaml
  target:
    kind: ConfigMap
    name: gitops-demo-config
- path: hpa-patch.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: gitops-demo-hpa

commonLabels:
  environment: prod

commonAnnotations:
  deployment.kubernetes.io/environment: prod
resources:
- ../../base
