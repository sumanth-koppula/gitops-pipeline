# k8s/overlays/dev/deployment-patch.yaml
# Strategic merge patch — only overrides what differs in dev
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
spec:
  replicas: 1                        # Single replica in dev (cost saving)
  template:
    spec:
      containers:
        - name: gitops-demo
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"        # Lower limits in dev
              cpu: "100m"
          env:
            - name: NODE_ENV
              value: development
            - name: LOG_LEVEL
              value: debug            # Verbose logging in dev
