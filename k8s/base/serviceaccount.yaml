# k8s/base/serviceaccount.yaml
# Uses GKE Workload Identity — no long-lived service account keys on pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitops-demo-sa
  labels:
    app: gitops-demo
  annotations:
    # GKE Workload Identity: maps K8s SA → GCP Service Account
    # Replace p3-cicd-pipeline with your actual project ID
    iam.gke.io/gcp-service-account: gitops-demo-ksa@p3-cicd-pipeline.iam.gserviceaccount.com
automountServiceAccountToken: false   # Disable unless needed
