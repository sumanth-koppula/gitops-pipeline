# helm/gitops-app/values.yaml
# Default values — overridden by values-dev/staging/prod.yaml

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: gcr.io/p3-cicd-pipeline/gitops-demo
  tag: latest
  pullPolicy: Always

# ── Application ───────────────────────────────────────────────────────────────
app:
  name: gitops-demo
  port: 3000
  environment: production
  logLevel: info

# ── Deployment ────────────────────────────────────────────────────────────────
replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# ── Autoscaling ───────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: gitops-demo.example.com
  tls:
    enabled: false
    secretName: gitops-demo-tls

# ── Health Probes ─────────────────────────────────────────────────────────────
probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: gitops-demo-sa
  annotations:
    iam.gke.io/gcp-service-account: gitops-demo-ksa@p3-cicd-pipeline.iam.gserviceaccount.com

# ── Security ──────────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 2000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# ── Pod Disruption Budget ────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# ── Extra environment variables ───────────────────────────────────────────────
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# ── Node selector / tolerations / affinity ────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
